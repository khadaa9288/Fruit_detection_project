{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FruitDetect AI | Login</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        body {

            min-height: 100vh;

            margin: 0;

            background: linear-gradient(
                135deg,
                #f1fff4,
                #e8f8ed
            );

            font-family: Arial, sans-serif;

        }


        .login-container {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

        }


        .login-card {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

        }


        /* ==========================================
           HEADER
        ========================================== */

        .login-header {

            background: linear-gradient(
                135deg,
                #198754,
                #20c997
            );

            color: white;

            text-align: center;

            padding: 35px 25px;

        }


        .login-icon {

            width: 70px;

            height: 70px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 18px;

            background: rgba(255, 255, 255, 0.20);

            font-size: 30px;

        }


        .login-header h2 {

            font-weight: 700;

            margin-bottom: 8px;

        }


        .login-header p {

            margin-bottom: 0;

        }


        /* ==========================================
           BODY
        ========================================== */

        .login-body {

            padding: 35px;

        }


        .form-label {

            font-weight: 600;

        }


        .form-control {

            height: 50px;

            border-radius: 10px;

            background-color: #eef4ff;

            border: 1px solid #ced4da;

        }


        .form-control:focus {

            background-color: white;

            border-color: #198754;

            box-shadow: none;

        }


        /* ==========================================
           USER LOGIN BUTTON
        ========================================== */

        .user-login-btn {

            height: 50px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

        }


        /* ==========================================
           DIVIDER
        ========================================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 15px;

            margin: 30px 0;

            color: #6c757d;

        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #dee2e6;

        }


        /* ==========================================
           ADMIN SECTION
        ========================================== */

        .admin-section {

            background: #f8f9fa;

            border: 1px solid #dee2e6;

            border-radius: 15px;

            padding: 25px;

            text-align: center;

        }


        .admin-icon {

            width: 55px;

            height: 55px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 15px;

            background: #212529;

            color: white;

            font-size: 24px;

        }


        .admin-section h5 {

            font-weight: 700;

            margin-bottom: 8px;

        }


        .admin-section p {

            color: #6c757d;

            font-size: 14px;

            margin-bottom: 18px;

        }


        .admin-login-btn {

            height: 45px;

            border-radius: 9px;

            font-weight: 600;

        }


        /* ==========================================
           REGISTER
        ========================================== */

        .register-section {

            text-align: center;

            margin-top: 25px;

        }


        .register-section a {

            text-decoration: none;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 576px) {

            .login-body {

                padding: 25px 20px;

            }

            .login-header {

                padding: 30px 20px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- ==========================================
             LOGIN HEADER
        ========================================== -->

        <div class="login-header">


            <div class="login-icon">

                <i class="bi bi-person-lock"></i>

            </div>


            <h2>

                Welcome Back!

            </h2>


            <p>

                Login to continue FruitDetect AI

            </p>


        </div>



        <!-- ==========================================
             LOGIN BODY
        ========================================== -->

        <div class="login-body">


            <!-- ERROR MESSAGE -->

            {% if error %}

                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    {{ error }}

                </div>

            {% endif %}



            <!-- ======================================
                 USER LOGIN
            ======================================= -->

            <div>

                <h5 class="fw-bold mb-3">

                    <i class="bi bi-person-fill me-2"></i>

                    User Login

                </h5>


                <form method="POST"
                      action="{% url 'login' %}">

                    {% csrf_token %}


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- USER LOGIN -->

                    <button
                        type="submit"
                        class="btn btn-primary user-login-btn w-100"
                    >

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Login as User

                    </button>


                </form>


            </div>



            <!-- ======================================
                 DIVIDER
            ======================================= -->

            <div class="divider">

                <span>OR</span>

            </div>



            <!-- ======================================
                 ADMIN LOGIN OPTION
            ======================================= -->

            <div class="admin-section">


                <div class="admin-icon">

                    <i class="bi bi-shield-lock-fill"></i>

                </div>


                <h5>

                    Administrator?

                </h5>


                <p>

                    If you are an administrator,
                    continue to the admin login page.

                </p>


                <!-- IMPORTANT:
                     This takes the admin to Django's
                     built-in admin login page.
                -->

                <a
                    href="/admin/login/"
                    class="btn btn-dark admin-login-btn w-100"
                >

                    <i class="bi bi-shield-lock-fill me-2"></i>

                    Login as Admin

                </a>


            </div>



            <!-- ======================================
                 REGISTER
            ======================================= -->

            <div class="register-section">


                <hr>


                <p class="text-muted mb-2">

                    Don't have an account?

                </p>


                <a
                    href="{% url 'register' %}"
                    class="btn btn-outline-success"
                >

                    <i class="bi bi-person-plus me-1"></i>

                    Create Account

                </a>


            </div>


        </div>


    </div>


</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
